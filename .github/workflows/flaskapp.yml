name: flask app CI/CD

on:
  push:
    branches:
      - main
      - solution

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build docker image
        run: docker build -t flask-app .

      - name: Run docker container
        run: docker run -d -p 8080:8080 --name flask-app flask-app

      - name: Check the container is up
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/octocat > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs flask-app
          exit 1

      - name: Update the Image Tag
        run: docker tag flask-app mkalra/flaskapp:1.0.0

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PWD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Push the Image
        run: docker push mkalra/flaskapp:1.0.0

      - name: Docker logout
        run: docker logout
